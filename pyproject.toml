[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "django-deploy-probes"
description = "Deployment probe endpoints for Django applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
    { name = "emfpdlzj", email = "redryan@ajou.ac.kr" },
]
maintainers = [
    { name = "emfpdlzj", email = "redryan@ajou.ac.kr" },
]
keywords = [
    "django",
    "deployment",
    "healthcheck",
    "kubernetes",
    "probe",
    "readiness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=5.2",
]

[project.optional-dependencies]
redis = [
    "redis>=4.5",
]
celery = [
    "celery>=5.3",
]
openapi = [
    "djangorestframework>=3.14",
    "drf-spectacular>=0.27",
]
all = [
    "celery>=5.3",
    "djangorestframework>=3.14",
    "drf-spectacular>=0.27",
    "redis>=4.5",
]

[project.urls]
Homepage = "https://github.com/emfpdlzj/django-deploy-probes"
Repository = "https://github.com/emfpdlzj/django-deploy-probes"
Issues = "https://github.com/emfpdlzj/django-deploy-probes/issues"
Documentation = "https://emfpdlzj.github.io/django-deploy-probes/"
Changelog = "https://github.com/emfpdlzj/django-deploy-probes/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2.0; python_version >= '3.10'",
    "mkdocs-material>=9.6; python_version >= '3.10'",
    "pre-commit>=3.7; python_version >= '3.10'",
    "pytest-cov>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
integration = [
    "django-storages[s3]>=1.14",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "RUF"]

[tool.ruff.lint.per-file-ignores]
"django_deploy_probes/checks/*.py" = ["BLE001"]
"django_deploy_probes/django_checks.py" = ["BLE001"]
"django_deploy_probes/management/commands/deploy_probes.py" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["django_deploy_probes"]

[tool.hatch.build.targets.sdist]
include = [
    "/django_deploy_probes",
    "/docs",
    "/examples",
    "/tests",
    "/mkdocs.yml",
    "/README.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/pyproject.toml",
]

[tool.hatch.version]
path = "django_deploy_probes/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["django_deploy_probes"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
