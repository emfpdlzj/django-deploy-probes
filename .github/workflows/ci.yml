name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "5.2.*"
          - python-version: "3.11"
            django-version: "5.2.*"
          - python-version: "3.12"
            django-version: "5.2.*"
          - python-version: "3.13"
            django-version: "5.2.*"
          - python-version: "3.14"
            django-version: "5.2.*"
          - python-version: "3.12"
            django-version: "6.0.*"
          - python-version: "3.13"
            django-version: "6.0.*"
          - python-version: "3.14"
            django-version: "6.0.*"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install "django==${{ matrix.django-version }}"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run python -Wd -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Build docs
        if: matrix.python-version == '3.13' && matrix.django-version == '6.0.*'
        run: uv run mkdocs build --strict

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.django-version == '6.0.*' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
          verbose: true

      - name: Build
        run: uv build

  integration:
    name: Django backend integration
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DEPLOY_PROBES_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run backend integration tests
        run: uv run pytest -q tests/test_integrations.py
