name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Smoke install built wheel
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re

          content = Path("django_deploy_probes/__init__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', content)
          if not match:
              raise SystemExit("Could not find __version__ in django_deploy_probes/__init__.py")
          print(match.group(1))
          PY
          )
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          pip install dist/*.whl
          python -c "import django_deploy_probes; assert django_deploy_probes.__version__ == '$PACKAGE_VERSION'"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
