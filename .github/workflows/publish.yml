name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Smoke test built wheel
        run: bash scripts/smoke_install.sh wheel

      - name: Smoke test built source distribution
        run: bash scripts/smoke_install.sh sdist

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
