name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re

          content = Path("django_deploy_probes/__init__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', content)
          if not match:
              raise SystemExit("Could not find __version__ in django_deploy_probes/__init__.py")
          print(match.group(1))
          PY
          )
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION."
            exit 1
          fi

      - name: Install release dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run release quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python -Wd -m pytest --cov --cov-report=term-missing
          uv run mkdocs build --strict

      - name: Build
        run: uv build

      - name: Validate distribution metadata
        run: uvx --python 3.12 --from 'twine>=6.2' twine check dist/*

      - name: Smoke install built distributions
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re

          content = Path("django_deploy_probes/__init__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', content)
          if not match:
              raise SystemExit("Could not find __version__ in django_deploy_probes/__init__.py")
          print(match.group(1))
          PY
          )
          DIST_DIR="$PWD/dist"

          python -m venv "$RUNNER_TEMP/wheel-smoke"
          . "$RUNNER_TEMP/wheel-smoke/bin/activate"
          python -m pip install "$DIST_DIR"/*.whl
          python -m pip check
          (
            cd "$RUNNER_TEMP"
            python -c "import django_deploy_probes; assert django_deploy_probes.__version__ == '$PACKAGE_VERSION'"
          )
          deactivate

          python -m venv "$RUNNER_TEMP/sdist-smoke"
          . "$RUNNER_TEMP/sdist-smoke/bin/activate"
          python -m pip install "$DIST_DIR"/*.tar.gz
          python -m pip check
          (
            cd "$RUNNER_TEMP"
            python -c "import django_deploy_probes; assert django_deploy_probes.__version__ == '$PACKAGE_VERSION'"
          )

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
