name: TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Validate distribution metadata
        run: uvx --python 3.12 --from 'twine>=6.2' twine check dist/*

      - name: Smoke install built distributions
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re

          content = Path("django_deploy_probes/__init__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', content)
          if not match:
              raise SystemExit("Could not find __version__ in django_deploy_probes/__init__.py")
          print(match.group(1))
          PY
          )
          DIST_DIR="$PWD/dist"

          python -m venv "$RUNNER_TEMP/wheel-smoke"
          . "$RUNNER_TEMP/wheel-smoke/bin/activate"
          python -m pip install "$DIST_DIR"/*.whl
          python -m pip check
          (
            cd "$RUNNER_TEMP"
            python -c "import django_deploy_probes; assert django_deploy_probes.__version__ == '$PACKAGE_VERSION'"
          )
          deactivate

          python -m venv "$RUNNER_TEMP/sdist-smoke"
          . "$RUNNER_TEMP/sdist-smoke/bin/activate"
          python -m pip install "$DIST_DIR"/*.tar.gz
          python -m pip check
          (
            cd "$RUNNER_TEMP"
            python -c "import django_deploy_probes; assert django_deploy_probes.__version__ == '$PACKAGE_VERSION'"
          )

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ --token "$TEST_PYPI_API_TOKEN"
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
