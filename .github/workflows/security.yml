name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit locked project dependencies
        run: |
          set -o pipefail
          for python_version in 3.10 3.12; do
            uv export \
              --python "$python_version" \
              --locked \
              --all-extras \
              --all-groups \
              --no-emit-project \
              --no-hashes | \
              uvx --python "$python_version" --from 'pip-audit>=2.9,<3.0' \
                pip-audit --requirement /dev/stdin --no-deps
          done
